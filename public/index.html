<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch Reviewer</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <span class="logo"><svg aria-hidden="true" viewBox="0 0 24 24"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>Branch Reviewer</span>
  <select id="repoSelect" aria-label="Repository"></select>
  <button class="ghost" data-act="fetch" title="git fetch --all --prune (needs VPN)"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><span>Fetch</span></button>
  <span class="grow"></span>
  <button class="ghost" data-act="add-repo"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add repo</button>
  <button class="ghost icon" data-act="settings" aria-label="Settings" title="Settings"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></button>
  <button class="ghost icon" data-act="theme" aria-label="Toggle light/dark theme" title="Toggle theme"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
</header>

<div class="layout">
  <aside class="side">
    <div class="side-tools">
      <input id="branchFilter" type="search" placeholder="Filter branches or authors" aria-label="Filter branches">
      <label class="chk"><input type="checkbox" id="hideMerged" checked> Hide branches with nothing to review</label>
    </div>
    <ul id="branchList" class="branches"></ul>
  </aside>
  <main id="main" class="main"><div class="empty">Add a repo, fetch, then pick a branch.</div></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<div id="toast" class="toast" role="status"></div>
<script src="highlight.js"></script>
<script src="app.js"></script>
</body>
</html>
